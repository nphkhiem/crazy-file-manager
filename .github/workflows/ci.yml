name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Swift
        run: >-
          xcrun swift-format lint
          --recursive
          --parallel
          --strict
          CrazyFileManager
          CrazyFileManagerTests
          CrazyFileManagerUITests

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -destination 'platform=macOS'
          -only-testing:CrazyFileManagerTests
          CODE_SIGNING_ALLOWED=NO

      - name: Build universal Release
        run: >-
          xcodebuild build
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -configuration Release
          -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO

  stress-benchmark:
    runs-on: macos-latest
    timeout-minutes: 150
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run stress benchmarks
        env:
          TEST_RUNNER_RUN_STRESS_BENCHMARK: "1"
        run: >-
          xcodebuild test
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -destination 'platform=macOS'
          -only-testing:CrazyFileManagerTests/SQLiteScanSnapshotIndexPerformanceTests
          -only-testing:CrazyFileManagerTests/SQLiteScanSnapshotIndexTests
          -resultBundlePath stress-results.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Upload stress benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-benchmark-results
          path: stress-results.xcresult
          retention-days: 90
