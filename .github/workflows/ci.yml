name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Swift
        run: >-
          xcrun swift-format lint
          --recursive
          --parallel
          --strict
          CrazyFileManager
          CrazyFileManagerTests
          CrazyFileManagerUITests

      - name: Static analysis
        run: >-
          xcodebuild analyze
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -destination 'platform=macOS'
          -only-testing:CrazyFileManagerTests
          CODE_SIGNING_ALLOWED=NO

      - name: Build universal Release
        run: >-
          xcodebuild build
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -configuration Release
          -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  release:
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive universal Release
        run: >-
          xcodebuild archive
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -configuration Release
          -archivePath build/CrazyFileManager.xcarchive
          -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO

      - name: Export and sign (or export unsigned if no credentials configured)
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12" ]; then
            echo "Developer ID credentials are configured; exporting with Developer ID signing."
            KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive -archivePath build/CrazyFileManager.xcarchive -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          else
            echo "No Developer ID credentials configured (DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 secret is unset)."
            echo "Skipping Developer ID signing and notarization. Exporting an ad-hoc-signed artifact instead."
            mkdir -p build/export
            cp -R "build/CrazyFileManager.xcarchive/Products/Applications/Crazy File Manager.app" "build/export/"
            codesign --force --deep --sign - "build/export/Crazy File Manager.app"
          fi

      - name: Notarize and staple (only if credentials are configured)
        if: ${{ secrets.NOTARIZATION_APPLE_ID != '' && secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 != '' }}
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZATION_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARIZATION_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent "build/export/Crazy File Manager.app" "build/export/CrazyFileManager.zip"
          xcrun notarytool submit "build/export/CrazyFileManager.zip" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARIZATION_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "build/export/Crazy File Manager.app"
          echo "Notarized and stapled." >> "$GITHUB_STEP_SUMMARY"

      - name: Report what actually happened
        if: always()
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12 }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
        run: |
          {
            echo "## Release build summary"
            if [ -n "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12" ]; then
              echo "- Signed with Developer ID: yes"
            else
              echo "- Signed with Developer ID: NO (no credentials configured, ad-hoc-signed instead)"
            fi
            if [ -n "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12" ] && [ -n "$NOTARIZATION_APPLE_ID" ]; then
              echo "- Notarized and stapled: yes"
            else
              echo "- Notarized and stapled: NO (no notarization credentials configured, or Developer ID signing was skipped)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate checksum
        run: |
          ditto -c -k --keepParent "build/export/Crazy File Manager.app" "build/CrazyFileManager.zip"
          shasum -a 256 build/CrazyFileManager.zip > build/CrazyFileManager.zip.sha256
          cat build/CrazyFileManager.zip.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/CrazyFileManager.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrazyFileManager-release
          path: |
            build/CrazyFileManager.zip
            build/CrazyFileManager.zip.sha256
          retention-days: 90

  stress-benchmark:
    runs-on: macos-latest
    timeout-minutes: 150
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run stress benchmarks
        env:
          TEST_RUNNER_RUN_STRESS_BENCHMARK: "1"
        run: >-
          xcodebuild test
          -project CrazyFileManager.xcodeproj
          -scheme CrazyFileManager
          -destination 'platform=macOS'
          -only-testing:CrazyFileManagerTests/SQLiteScanSnapshotIndexPerformanceTests
          -only-testing:CrazyFileManagerTests/SQLiteScanSnapshotIndexTests
          -resultBundlePath stress-results.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Upload stress benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-benchmark-results
          path: stress-results.xcresult
          retention-days: 90
